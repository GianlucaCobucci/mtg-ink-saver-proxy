<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Ink-Saver Proxy</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="symbols.js"></script>
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --mut:#666; --line:#d4d4d4; --acc:#111; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#eee; --mut:#999; --line:#333; --acc:#eee; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { display:grid; grid-template-columns: 340px 1fr; gap:24px; max-width:1200px; margin:0 auto; padding:24px 16px; min-height:100vh; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  h1 { font-size:20px; margin:0 0 12px; }
  textarea { width:100%; height:280px; font:13px/1.4 ui-monospace, monospace; padding:8px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; resize:vertical; }
  label { display:block; margin:10px 0 2px; font-size:13px; color:var(--mut); }
  label.chk { display:flex; gap:8px; align-items:center; color:var(--fg); }
  input[type=range] { width:100%; }
  button { margin-top:14px; width:100%; padding:10px; font:inherit; font-weight:600; border:0; border-radius:6px; background:var(--acc); color:var(--bg); cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #status { margin-top:10px; font-size:13px; color:var(--mut); white-space:pre-wrap; }
  iframe { width:100%; height:calc(100vh - 48px); border:1px solid var(--line); border-radius:6px; background:#fff; }
  #dl { display:none; }
</style>
</head>
<body>
<main>
  <section>
    <h1>MTG Ink-Saver Proxy</h1>
    <textarea id="deck" placeholder="4 Lightning Bolt&#10;1 Sol Ring&#10;2x Counterspell (MH2) 267"></textarea>

    <label class="chk"><input id="strip" type="checkbox" checked> Rimuovi reminder text tra parentesi</label>
    <label class="chk"><input id="backs" type="checkbox" checked> Stampa anche il retro delle carte doppia faccia</label>

    <button id="go">Genera PDF</button>
    <button id="dl">Scarica PDF</button>
    <div id="status"></div>
  </section>
  <section><iframe id="pv" title="Anteprima PDF"></iframe></section>
</main>

<script>
const { jsPDF } = window.jspdf;
const $ = id => document.getElementById(id);

// Geometria (mm). Carta reale 63x88, A4 3x3.
const CW = 63, CH = 88, PW = 210, PH = 297;
const MX = (PW - 3 * CW) / 2, MY = (PH - 3 * CH) / 2;
const ART_W = 57, ART_H = 41;


/* ---------- Decklist ---------- */
function parseDeck(text) {
  const out = [];
  for (let line of text.split(/\r?\n/)) {
    line = line.trim();
    if (!line || /^(\/\/|#)/.test(line) || /^(deck|sideboard|commander|companion|maybeboard)\s*:?$/i.test(line)) continue;
    line = line.replace(/^SB:\s*/i, '');
    const m = line.match(/^(\d+)\s*x?\s+(.+)$/i);
    const qty = m ? parseInt(m[1], 10) : 1;
    let name = (m ? m[2] : line)
      .replace(/\s*\([A-Za-z0-9]{2,6}\)\s*\S*\s*$/, '')   // (SET) 123
      .replace(/\s+\*[A-Za-z]+\*$/, '')
      .split(/\s*\/\/\s*/)[0].trim();   // "Fire // Ice" -> "Fire"
    if (name) out.push({ qty, name });
  }
  return out;
}

/* ---------- Scryfall ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchCards(names) {
  const found = new Map(), missing = [];
  for (let i = 0; i < names.length; i += 75) {
    const chunk = names.slice(i, i + 75);
    const res = await fetch('https://api.scryfall.com/cards/collection', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ identifiers: chunk.map(name => ({ name })) })
    });
    if (!res.ok) throw new Error('Scryfall ' + res.status);
    const j = await res.json();
    for (const c of j.data) {
      found.set(c.name.toLowerCase(), c);
      (c.card_faces || []).forEach(f => found.set(f.name.toLowerCase(), c));
    }
    (j.not_found || []).forEach(n => missing.push(n.name));
    await sleep(120);
  }
  return { found, missing };
}

// Una carta Scryfall -> una o più "facce stampabili"
function toPrintable(c, withBacks) {
  const dfc = c.card_faces && c.card_faces[0].image_uris;
  const mk = (f, art) => ({
    name: f.name, cost: f.mana_cost || '', type: f.type_line || '',
    text: f.oracle_text || '', pt: f.power != null ? `${f.power}/${f.toughness}` : (f.loyalty ? String(f.loyalty) : (f.defense ? String(f.defense) : '')),
    art
  });
  if (dfc) {
    const faces = withBacks ? c.card_faces : [c.card_faces[0]];
    return faces.map(f => mk(f, f.image_uris.art_crop));
  }
  if (c.card_faces) { // split / adventure / flip: una sola immagine
    const f = c.card_faces;
    return [{
      name: c.name, cost: f.map(x => x.mana_cost || '').join(' // '), type: c.type_line || '',
      text: f.map(x => x.oracle_text || '').join('\n—\n'),
      pt: f[0].power != null ? `${f[0].power}/${f[0].toughness}` : '',
      art: c.image_uris && c.image_uris.art_crop
    }];
  }
  return [mk(c, c.image_uris && c.image_uris.art_crop)];
}

/* ---------- Simboli di mana (SVG Scryfall incorporati -> B/N) ---------- */
function loadImg(url) {
  return new Promise((res, rej) => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => res(im); im.onerror = () => rej(new Error('img'));
    im.src = url;
  });
}

const symCache = new Map();
async function symbolImg(code) {            // code: "{2}", "{W/U}", ...
  if (symCache.has(code)) return symCache.get(code);
  let out = null;
  try {
    const im = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(MANA_SVG[code]));
    const N = 96, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(im, 0, 0, N, N);
    const d = ctx.getImageData(0, 0, N, N);
    for (let i = 0; i < N * N; i++) {       // glifo scuro -> nero, resto bianco
      const lum = 0.299 * d.data[i*4] + 0.587 * d.data[i*4+1] + 0.114 * d.data[i*4+2];
      const v = d.data[i*4+3] > 40 && lum < 100 ? 0 : 255;
      d.data[i*4] = d.data[i*4+1] = d.data[i*4+2] = v; d.data[i*4+3] = 255;
    }
    ctx.putImageData(d, 0, 0);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(N / 2, N / 2, N / 2 - 4, 0, Math.PI * 2); ctx.stroke();
    out = cv.toDataURL('image/png');
  } catch {}
  symCache.set(code, out);
  return out;
}

/* ---------- Disegno carta ---------- */
const MM_PT = 0.3528;
const clean = s => (s || '')
  .replace(/[−–]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/•/g, '*')
  .replace(/—/g, '-').replace(/[^\x20-\x7E -ÿ\n]/g, '?');

function fitText(doc, str, maxW, size, min) {
  doc.setFontSize(size);
  while (size > min && doc.getTextWidth(str) > maxW) { size -= 0.25; doc.setFontSize(size); }
  return size;
}

function drawCard(doc, x, y, c, strip) {
  doc.setDrawColor(0); doc.setLineWidth(0.3); doc.setTextColor(0); doc.setFillColor(255);
  doc.roundedRect(x, y, CW, CH, 3, 3, 'S');

  // barra nome
  doc.setLineWidth(0.25);
  doc.roundedRect(x + 3, y + 3, 57, 6.5, 1.5, 1.5, 'S');
  const syms = c.cost.match(/\{[^}]+\}/g) || [];
  const SS = 3.4;                           // lato simbolo (mm)
  doc.setFont('helvetica', 'bold');
  let cw = 0;
  [...syms].reverse().forEach(code => {   // da destra a sinistra, così l ordine resta quello del costo
    cw += SS + 0.3;
    const img = symCache.get(code);
    const sx = x + 58.5 - cw + 0.3, sy = y + 3.1 + (6.5 - SS) / 2;
    if (img) doc.addImage(img, 'PNG', sx, sy, SS, SS, undefined, 'FAST');
    else { doc.setFontSize(6); doc.text(code.replace(/[{}]/g, ''), sx, sy + 2.5); }
  });
  fitText(doc, clean(c.name), 57 - 3 - cw - 1, 8.5, 5);
  doc.text(clean(c.name), x + 4.5, y + 7.4);

  // illustrazione
  doc.rect(x + 3, y + 10.5, ART_W, ART_H, 'S');

  // barra tipo
  doc.roundedRect(x + 3, y + 52.5, 57, 5.5, 1.5, 1.5, 'S');
  fitText(doc, clean(c.type), 54, 7, 4.5);
  doc.text(clean(c.type), x + 4.5, y + 56.3);

  // text box
  doc.rect(x + 3, y + 59.2, 57, 24.3, 'S');
  const hasPT = !!c.pt;
  const availH = hasPT ? 17.5 : 22;
  let text = clean(c.text).replace(/\{([^}]+)\}/g, '[$1]');
  if (strip) text = text.replace(/\s*\([^)]*\)/g, '').replace(/\n{2,}/g, '\n').trim();
  doc.setFont('helvetica', 'normal');
  const paras = text.split('\n');
  let size = 7.5, lines;
  for (; size >= 3.5; size -= 0.25) {
    doc.setFontSize(size);
    lines = paras.flatMap(p => doc.splitTextToSize(p, 54));
    if (lines.length * size * MM_PT * 1.12 <= availH) break;
  }
  doc.text(lines, x + 4.5, y + 59.2 + 1.2 + size * MM_PT * 0.85, { lineHeightFactor: 1.12 });

  // P/T o lealtà
  if (hasPT) {
    doc.setFillColor(255); doc.roundedRect(x + 44, y + 79, 16, 6.5, 1.5, 1.5, 'FD');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.text(clean(c.pt), x + 52, y + 83.6, { align: 'center' });
  }
}

/* ---------- Pagina ---------- */
function drawCutGuides(doc) {
  doc.setDrawColor(150); doc.setLineWidth(0.1);
  for (let i = 0; i <= 3; i++) {
    doc.line(MX + i * CW, 0, MX + i * CW, PH);
    doc.line(0, MY + i * CH, PW, MY + i * CH);
  }
}

/* ---------- Main ---------- */
let blobUrl = null;
$('go').onclick = async () => {
  const btn = $('go'), st = $('status');
  const log = m => st.textContent = m;
  btn.disabled = true; $('dl').style.display = 'none';
  try {
    const deck = parseDeck($('deck').value);
    if (!deck.length) throw new Error('Decklist vuota.');
    log('Cerco le carte su Scryfall…');
    const { found, missing } = await fetchCards([...new Set(deck.map(d => d.name))]);

    const printable = [];
    const notFound = new Set(missing);
    for (const d of deck) {
      const sc = found.get(d.name.toLowerCase());
      if (!sc) { notFound.add(d.name); continue; }
      for (const f of toPrintable(sc, $('backs').checked)) for (let k = 0; k < d.qty; k++) printable.push(f);
    }
    const codes = new Set(printable.flatMap(c => c.cost.match(/\{[^}]+\}/g) || []));
    log('Scarico i simboli di mana…');
    await Promise.all([...codes].map(symbolImg));
    if (!printable.length) throw new Error('Nessuna carta trovata.');

    log('Compongo il PDF…');
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    printable.forEach((c, i) => {
      const slot = i % 9;
      if (i > 0 && slot === 0) doc.addPage();
      if (slot === 0) drawCutGuides(doc);
      drawCard(doc, MX + (slot % 3) * CW, MY + Math.floor(slot / 3) * CH, c, $('strip').checked);
    });

    const blob = doc.output('blob');
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(blob);
    $('pv').src = blobUrl;
    $('dl').style.display = 'block';
    log(`${printable.length} carte, ${Math.ceil(printable.length / 9)} pagine.` +
        (notFound.size ? `\nNon trovate: ${[...notFound].join(', ')}` : ''));
  } catch (e) {
    log('Errore: ' + e.message);
  } finally { btn.disabled = false; }
};
$('dl').onclick = () => { const a = document.createElement('a'); a.href = blobUrl; a.download = 'proxy.pdf'; a.click(); };
</script>
</body>
</html>
